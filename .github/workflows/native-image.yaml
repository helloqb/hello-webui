name: Publish hello-webui image

on:
  push:
    tags: ['native-*']

concurrency:
  group: native-image-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ${{ vars.NATIVE_IMAGE_PLATFORM == 'linux/arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Set image reference
        id: image
        env:
          PLATFORM: ${{ vars.NATIVE_IMAGE_PLATFORM || 'linux/amd64' }}
        run: |
          case "$PLATFORM" in
            linux/amd64|linux/arm64) ;;
            *) echo 'NATIVE_IMAGE_PLATFORM must be linux/amd64 or linux/arm64' >&2; exit 1 ;;
          esac
          if [[ ! "$GITHUB_REF_NAME" =~ ^native-[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'Expected a tag such as native-0.13.4.1' >&2
            exit 1
          fi
          echo "ref=ghcr.io/${GITHUB_REPOSITORY,,}:$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          echo "platform=$PLATFORM" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish CPU image
        id: build
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: .
          platforms: ${{ steps.image.outputs.platform }}
          push: true
          tags: ${{ steps.image.outputs.ref }}
          build-args: |
            BUILD_HASH=${{ github.sha }}
            BUILD_CHANNEL=deepseek-native
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
          cache-from: type=gha,scope=hello-webui-${{ runner.arch }}
          cache-to: type=gha,scope=hello-webui-${{ runner.arch }},mode=min

      - name: Report image digest
        env:
          IMAGE: ${{ steps.image.outputs.ref }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: printf 'Image `%s`\n\nDigest `%s`\n' "$IMAGE" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
