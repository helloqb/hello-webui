name: hello-webui

services:
  webui:
    image: ${WEBUI_IMAGE:?Set WEBUI_IMAGE in .env}
    restart: unless-stopped
    ports:
      - "${WEBUI_BIND_ADDRESS:-127.0.0.1}:${WEBUI_PORT:-3000}:8080"
    environment:
      WEBUI_URL: ${WEBUI_URL:-http://127.0.0.1:3000}
      CORS_ALLOW_ORIGIN: ${WEBUI_URL:-http://127.0.0.1:3000}
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY:?Set WEBUI_SECRET_KEY in .env}
      WEBUI_AUTH_COOKIE_SECURE: "${WEBUI_COOKIE_SECURE:-false}"
      WEBUI_SESSION_COOKIE_SECURE: "${WEBUI_COOKIE_SECURE:-false}"
      ENABLE_OLLAMA_API: 'false'
      ENABLE_SIGNUP: 'false'
    volumes:
      - webui-data:/app/backend/data

volumes:
  webui-data:
    name: ${WEBUI_DATA_VOLUME:-hello-webui-data}
